<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Returning to app...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background: #f5f5f5;
            text-align: center;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 2px 16px rgba(0,0,0,0.1);
        }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h1 { font-size: 22px; color: #1f2937; margin: 0 0 8px; }
        p { font-size: 15px; color: #6b7280; margin: 0 0 24px; line-height: 1.5; }
        .btn {
            display: inline-block;
            background: #6366f1;
            color: white;
            padding: 14px 28px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            width: 100%;
            box-sizing: border-box;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #e5e7eb;
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #status { display: block; }
        #fallback { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div id="status">
            <div class="spinner"></div>
            <h1>Returning to app...</h1>
            <p>Opening the AgeWallet demo app.</p>
        </div>
        <div id="fallback">
            <div class="icon">📱</div>
            <h1>Open in App</h1>
            <p>Tap the button below to return to the AgeWallet demo app and complete verification.</p>
            <a id="open-btn" class="btn" href="#">Open App</a>
        </div>
    </div>

    <script>
        var params = window.location.search;
        var fullPath = '/callback' + params;
        var isAndroid = /android/i.test(navigator.userAgent);
        var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

        function showFallback(href) {
            document.getElementById('status').style.display = 'none';
            document.getElementById('fallback').style.display = 'block';
            document.getElementById('open-btn').href = href;
        }

        if (isAndroid) {
            // Intent URL triggers Android's intent resolution — routes to the installed demo app
            // via its App Link intent filter for this domain
            var intentUrl = 'intent://agewallet-sdk-demo.netlify.app' + fullPath
                + '#Intent;scheme=https;action=android.intent.action.VIEW;'
                + 'category=android.intent.category.BROWSABLE;end';

            window.location.replace(intentUrl);

            // If intent URL didn't open the app, show fallback after 2s
            setTimeout(function() {
                showFallback(intentUrl);
            }, 2000);

        } else if (isIOS) {
            // Universal Links: navigate to the same https URL
            // iOS will intercept it if the app is installed and apple-app-site-association is configured
            var universalLink = 'https://agewallet-sdk-demo.netlify.app' + fullPath;
            showFallback(universalLink);

        } else {
            // Desktop — this page is only meaningful on mobile
            document.getElementById('status').style.display = 'none';
            document.getElementById('fallback').style.display = 'block';
            document.getElementById('fallback').querySelector('.icon').textContent = 'ℹ️';
            document.getElementById('fallback').querySelector('h1').textContent = 'Mobile only';
            document.getElementById('fallback').querySelector('p').textContent =
                'This callback page is used by the AgeWallet mobile SDK demo apps.';
            document.getElementById('open-btn').style.display = 'none';
        }
    </script>
</body>
</html>
